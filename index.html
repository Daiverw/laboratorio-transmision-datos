<style>
:root{--ink:#061022;--panel:#0c1b36;--edge:#24427a;--grid:#1a3460;--text:#e9f0fb;--muted:#93a6c7;--signal:#4fd1ff;--fiber:#ffb000;--uft:#8f1d3c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/40px 40px,var(--ink);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.6;min-height:100vh}
.inst{background:#fff;border-bottom:4px solid var(--uft)}
.wrap{max-width:960px;margin:0 auto;padding:0 24px}
.inst .wrap{padding:12px 24px}
.inst img{height:62px;display:block}
h1{font-family:'Chakra Petch',sans-serif;font-size:clamp(32px,5vw,56px);line-height:1.05;margin:56px 0 10px}
.sub{color:var(--muted);font-size:18px}
.list{display:grid;gap:16px;margin:40px 0 80px}
a.act{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;text-decoration:none;color:var(--text);background:rgba(12,27,54,.92);border:1px solid var(--edge);border-radius:18px;padding:20px 22px;transition:border-color .2s,transform .2s}
a.act:hover,a.act:focus-visible{border-color:var(--signal);transform:translateY(-2px);outline:none}
.ico{width:56px;height:56px;border-radius:14px;background:#10264a;border:1px solid var(--edge);display:grid;place-items:center}
a.act b{font-family:'Chakra Petch',sans-serif;font-size:22px;display:block}
a.act span{color:var(--muted);font-size:15px}
footer{color:var(--muted);font-size:14px;padding-bottom:40px}
</style>
</head>
